<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New race information incoming</title>
  <meta http-equiv="refresh" content="10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Titillium+Web:wght@900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #1a120f;
    }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .crowd {
      position: fixed;
      inset: -6%;
      width: 112%;
      height: 112%;
      filter: blur(11px) saturate(1.25) contrast(1.05);
      transform: scale(1.04);
      animation: drift 26s ease-in-out infinite alternate;
    }
    .vignette {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.28), transparent 18%, transparent 82%, rgba(0,0,0,.28)),
        radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.38) 100%);
      pointer-events: none;
    }
    .card {
      position: relative;
      width: min(820px, calc(100vw - 40px));
      max-height: calc(100dvh - 16px);
      background: #0c0c0e;
      color: #fff;
      padding: 40px 52px 56px;
      box-shadow: 0 30px 70px rgba(0,0,0,.55);
      animation: cardIn .28s cubic-bezier(.2,.7,.2,1) both;
    }
    .mast {
      text-align: right;
      line-height: .78;
    }
    .mast-name,
    .mast-sub {
      display: block;
      font-family: "Titillium Web", "Arial Black", Impact, sans-serif;
      font-weight: 900;
      letter-spacing: -0.015em;
      text-transform: uppercase;
    }
    .mast-name {
      color: #ff1a1a;
      font-size: clamp(96px, 12vw, 132px);
      animation: slam .22s .08s cubic-bezier(.2,.8,.2,1) both;
    }
    .mast-sub {
      color: #fff;
      font-size: clamp(78px, 10vw, 108px);
      margin-top: 2px;
      animation: slam .22s .2s cubic-bezier(.2,.8,.2,1) both;
    }
    .identity {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 220px;
      margin: 28px 0 12px;
      animation: heroIn .2s .34s ease both;
    }
    .identity::before {
      content: "";
      position: absolute;
      left: -42px;
      right: 22%;
      bottom: 22px;
      height: 92px;
      background: linear-gradient(90deg, #7a1418 0%, rgba(110,16,20,.8) 42%, rgba(40,6,8,0) 100%);
    }
    .mark {
      position: relative;
      width: 310px;
      height: 200px;
      flex: none;
      margin-left: -8px;
    }
    .mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .crest {
      position: relative;
      width: 136px;
      height: 136px;
      flex: none;
      margin-right: 4px;
    }
    .crest img,
    .crest svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
    }
    .crest img {
      object-fit: cover;
      z-index: 1;
    }
    .log {
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      gap: 34px;
    }
    .msg {
      margin: 0;
      text-align: center;
      font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      font-style: italic;
      font-weight: 800;
      font-size: clamp(36px, 4.8vw, 52px);
      line-height: .98;
      letter-spacing: .02em;
      text-transform: uppercase;
      animation: lineIn .2s ease both;
    }
    .driver { color: #ff1a1a; }
    .engineer { color: #f5f5f5; font-weight: 700; }
    .d1 { animation-delay: .72s; }
    .d2 { animation-delay: 1.55s; font-size: clamp(30px, 4vw, 40px); }
    .d3 { animation-delay: 2.25s; font-size: clamp(30px, 4vw, 40px); }
    @keyframes drift {
      from { transform: scale(1.04) translate3d(0,0,0); }
      to { transform: scale(1.08) translate3d(-1.2%, -0.6%, 0); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes slam {
      from { opacity: 0; transform: translateX(22px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes heroIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes lineIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @media (max-height: 760px) {
      .card { padding: 16px 22px 22px; }
      .mast-name { font-size: 58px; }
      .mast-sub { font-size: 46px; }
      .identity { min-height: 96px; margin: 10px 0 6px; }
      .mark { width: 140px; height: 96px; }
      .crest { width: 68px; height: 68px; }
      .log { gap: 12px; margin-top: 10px; }
      .msg { font-size: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .crowd, .card, .mast-name, .mast-sub, .identity, .msg { animation: none; }
    }
  </style>
</head>

  <script>
    (function () {
      const canvas = document.getElementById('crowd');
      const ctx = canvas.getContext('2d', { alpha: false });
      const w = canvas.width = 900;
      const h = canvas.height = 1400;
      ctx.fillStyle = '#4e3b34';
      ctx.fillRect(0, 0, w, h);
      const colors = ['#f4f1ea', '#efe2d4', '#e0b394', '#d6453d', '#c0392b', '#1d4e89', '#f2c14e', '#1c1c1c', '#f7f7f7', '#8d6a55', '#3d6b9a', '#e8d5c4', '#b03a32', '#f0e6d8'];
      for (let i = 0; i < 14000; i++) {
        ctx.fillStyle = colors[i % colors.length];
        const x = Math.random() * w;
        const y = Math.random() * h * 0.74;
        ctx.fillRect(x, y, 1.5 + Math.random() * 3.2, 2.5 + Math.random() * 6);
      }
      const grass = ctx.createLinearGradient(0, h * 0.58, 0, h);
      grass.addColorStop(0, 'rgba(46,92,42,0)');
      grass.addColorStop(0.22, '#2f6a34');
      grass.addColorStop(0.55, '#1f4e28');
      grass.addColorStop(1, '#16381c');
      ctx.fillStyle = grass;
      ctx.fillRect(0, h * 0.58, w, h * 0.42);
      ctx.fillStyle = '#8a8680';
      ctx.fillRect(0, h * 0.8, w, 18);
      ctx.fillStyle = '#5e6a58';
      ctx.fillRect(0, h * 0.8 + 18, w, h);

    })();
  </script>
